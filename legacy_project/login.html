<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SRIRAM's IAS</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="register-container">
        <!-- Left Side: Visual/Branding (Reusing styles from register.css) -->
        <div class="register-branding" style="background-image: url('assets/hero-bg.png');">
            <div class="branding-content">
                <a href="index.html" class="logo text-white mb-4"
                    style="display:inline-block; font-size: 2rem;">SRIRAM's <span>IAS</span></a>
                <h1 class="branding-title">Welcome Back, <br> <span class="text-highlight">Future Leader</span></h1>
                <p class="branding-desc">Continue your preparation journey. Access your dashboard, live classes, and
                    test series.</p>

                <div class="branding-features">
                    <div class="feature-item">
                        <i class="ri-checkbox-circle-fill"></i> <span>Resume Learning</span>
                    </div>
                    <div class="feature-item">
                        <i class="ri-checkbox-circle-fill"></i> <span>Track Progress</span>
                    </div>
                </div>
            </div>
            <div class="branding-overlay"></div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="register-form-wrapper">
            <div class="form-header">
                <h2>Login to Account</h2>
                <p>New to SRIRAM's IAS? <a href="register.html">Create an Account</a></p>
            </div>

            <form class="register-form">
                <!-- Phone or Email -->
                <div class="form-group">
                    <label for="username">Phone Number or Email</label>
                    <div class="input-wrapper">
                        <i class="ri-user-line"></i>
                        <input type="text" id="username" placeholder="Enter your registered email or phone" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="form-check" style="justify-content: space-between; margin-bottom: 2rem;">
                    <div style="display:flex; align-items:center; gap:0.5rem;">
                        <input type="checkbox" id="remember">
                        <label for="remember" style="margin:0; font-weight:400;">Remember me</label>
                    </div>
                    <a href="#" style="font-size:0.9rem; font-weight:600;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login <i class="ri-login-box-line"></i></button>

                <div style="text-align: center; margin-top: 1.5rem; color: #64748b;">
                    <p>Or login with</p>
                    <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1rem;">
                        <button type="button" class="btn btn-white"
                            style="border: 1px solid #e2e8f0; border-radius: 50%; width: 48px; height: 48px; padding:0; display:flex; align-items:center; justify-content:center;">
                            <i class="ri-google-fill" style="font-size: 1.5rem; color: #ea4335;"></i>
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>

</body>

</html>
